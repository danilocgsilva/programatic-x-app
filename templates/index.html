<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Long type in</title>
  <link href="/static/output.css" rel="stylesheet">
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-5xl">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Lont Type</h1>

    {% if submitted %}
    <div class="mb-4 p-3 bg-green-100 text-green-800 rounded">
      <p class="mb-2">We received your input:</p>
      <pre class="whitespace-pre-wrap break-words">{{ data }}</pre>
      <p>Seconds: {{ seconds }}</p>
    </div>
    {% endif %}

    <form id="my-form" method="post" action="/submit" class="space-y-4">
      <div>
        <label for="data" class="block text-sm font-medium text-gray-700">Paste the long data here</label>
        <textarea id="data" name="data" rows="18" required
          class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      <!-- Parent wrapper to control the row/column layout -->
      <div class="w-full options-container">
        <div class="flex flex-col gap-6 w-full options-layout">

          <!-- First item -->
          <!-- Added min-w-0 to allow shrinking -->
          <div class="flex items-center gap-6 w-full min-w-0">
            <!-- Removed whitespace-nowrap so the text can wrap on small screens -->
            <label for="seconds" class="text-sm font-medium text-gray-700">
              Countdown in seconds
            </label>
            <input id="seconds" name="seconds" type="number" value="10" min="0" step="1" required
              class="flex-1 min-w-0 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <!-- Second item -->
          <!-- Added min-w-0 to allow shrinking -->
          <div class="flex items-center gap-6 w-full min-w-0">
            <!-- Removed whitespace-nowrap so the text can wrap on small screens -->
            <label for="delay-by-type" class="text-sm font-medium text-gray-700">
              Delay by type in milliseconds
            </label>
            <input id="delay-by-type" name="delay_by_type_ms" type="number" value="0" min="0" step="1"
              class="flex-1 min-w-0 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

        </div>
      </div>

      <div>
        <label class="text-sm font-medium text-gray-700">
          <input id="shift-enter-in-newlines" name="shift_enter_in_newlines" type="checkbox">
          Shift + Enter in newlines
        </label>
      </div>

      <button type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md transition">
        Submit
      </button>
      <p id="countdown-status" class="text-sm text-gray-700" role="status" aria-live="polite"></p>
    </form>
  </div>

  <!-- TypeScript compiled output -->
  <script src="/static/form.js" type="module"></script>
</body>

</html>
