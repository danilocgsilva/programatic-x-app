[tool.setuptools]
py-modules = ["main"]

[project]
name = "programatic-x-app"
version = "1.0.0"
description = "A web browser interface to control programatic-x."
requires-python = ">=3.9"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "programatic-x @ git+https://github.com/danilocgsilva/programatic-x.git",
]
